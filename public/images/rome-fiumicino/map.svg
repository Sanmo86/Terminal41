<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
  <rect width="1200" height="640" fill="#f8fafc"/>
  <text x="600" y="44" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#1e293b" text-anchor="middle">FCO — Simplified Terminal Layout</text>

  <rect x="60" y="560" width="1080" height="14" rx="7" fill="#cbd5e1"/>

  <!-- T1 -->
  <g>
    <rect x="220" y="160" width="320" height="220" rx="14" fill="#f0fdf4" stroke="#166534" stroke-width="2"/>
    <text x="380" y="210" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#166534" text-anchor="middle">Terminal 1</text>
    <text x="380" y="240" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569" text-anchor="middle">ITA Airways</text>
    <rect x="270" y="280" width="220" height="46" rx="8" fill="#166534"/>
    <text x="380" y="309" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">Leonardo Express</text>
  </g>

  <line x1="540" y1="270" x2="640" y2="270" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8 6"/>

  <!-- T3 -->
  <g>
    <rect x="640" y="150" width="340" height="240" rx="14" fill="#fef2f2" stroke="#9f1239" stroke-width="2"/>
    <text x="810" y="200" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#9f1239" text-anchor="middle">Terminal 3</text>
    <text x="810" y="230" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569" text-anchor="middle">Schengen &amp; non-Schengen hub</text>
    <text x="810" y="255" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569" text-anchor="middle">the largest terminal</text>
  </g>

  <text x="600" y="620" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Simplified schematic, not to scale — see the official interactive map for precise wayfinding.</text>
</svg>
