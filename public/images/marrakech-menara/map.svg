<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
  <rect width="1200" height="640" fill="#f8fafc"/>
  <text x="600" y="44" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#1e293b" text-anchor="middle">RAK — Simplified Terminal Layout</text>

  <rect x="60" y="560" width="1080" height="14" rx="7" fill="#cbd5e1"/>

  <!-- T1 -->
  <g>
    <rect x="220" y="160" width="340" height="220" rx="14" fill="#fff7ed" stroke="#9a3412" stroke-width="2"/>
    <text x="390" y="205" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#7c2d12" text-anchor="middle">Terminal 1</text>
    <text x="390" y="235" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#475569" text-anchor="middle">Main terminal, domestic</text>
    <text x="390" y="255" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#475569" text-anchor="middle">+ international flights</text>
    <rect x="280" y="290" width="220" height="46" rx="8" fill="#9a3412"/>
    <text x="390" y="319" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">Bus L19 · Taxi · Ride-hailing</text>
  </g>

  <line x1="560" y1="270" x2="640" y2="270" stroke="#94a3b8" stroke-width="4" stroke-dasharray="8 6"/>

  <!-- T2 -->
  <g>
    <rect x="640" y="160" width="340" height="220" rx="14" fill="#f0fdf4" stroke="#166534" stroke-width="2"/>
    <text x="810" y="205" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#166534" text-anchor="middle">Terminal 2</text>
    <text x="810" y="235" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#475569" text-anchor="middle">Complements T1 for</text>
    <text x="810" y="255" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#475569" text-anchor="middle">domestic + international</text>
  </g>

  <text x="600" y="620" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Simplified schematic, not to scale — see the official interactive map for precise wayfinding.</text>
</svg>
