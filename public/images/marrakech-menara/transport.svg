<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <rect width="1200" height="360" fill="none"/>
  <!-- Bus -->
  <g>
    <rect x="20" y="20" width="368" height="320" rx="16" fill="#f0fdf4" stroke="#166534" stroke-width="2"/>
    <circle cx="204" cy="90" r="34" fill="#166534"/>
    <text x="204" y="100" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#ffffff" text-anchor="middle">L19</text>
    <text x="204" y="160" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#1e293b" text-anchor="middle">Airport Bus (Line 19)</text>
    <text x="204" y="200" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#166534" text-anchor="middle">30 MAD (~$3)</text>
    <text x="204" y="232" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569" text-anchor="middle">~25–45 min to Medina</text>
    <text x="204" y="260" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">Cheapest option, runs regularly</text>
  </g>
  <!-- Petit Taxi -->
  <g>
    <rect x="416" y="20" width="368" height="320" rx="16" fill="#fff7ed" stroke="#9a3412" stroke-width="2"/>
    <circle cx="600" cy="90" r="34" fill="#9a3412"/>
    <text x="600" y="100" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#ffffff" text-anchor="middle">TAXI</text>
    <text x="600" y="160" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#1e293b" text-anchor="middle">Official Airport Taxi</text>
    <text x="600" y="200" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#9a3412" text-anchor="middle">100–150 MAD (day)</text>
    <text x="600" y="232" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569" text-anchor="middle">~20–30 min to the Medina</text>
    <text x="600" y="260" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">Fixed prepaid fare, no haggling</text>
  </g>
  <!-- Ride-hailing -->
  <g>
    <rect x="812" y="20" width="368" height="320" rx="16" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
    <circle cx="996" cy="90" r="34" fill="#1e3a8a"/>
    <text x="996" y="100" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle">RIDE</text>
    <text x="996" y="160" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#1e293b" text-anchor="middle">Ride-hailing / Uber</text>
    <text x="996" y="200" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#1d4ed8" text-anchor="middle">120–220 MAD</text>
    <text x="996" y="232" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569" text-anchor="middle">~20–30 min depending on traffic</text>
    <text x="996" y="260" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">Price varies with demand</text>
  </g>
</svg>
