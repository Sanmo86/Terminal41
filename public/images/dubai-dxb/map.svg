<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
  <rect width="1200" height="640" fill="#f8fafc"/>
  <text x="600" y="44" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#1e293b" text-anchor="middle">DXB — Simplified Terminal Layout</text>

  <rect x="60" y="560" width="1080" height="14" rx="7" fill="#cbd5e1"/>

  <!-- T1 -->
  <g>
    <rect x="120" y="170" width="280" height="200" rx="14" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
    <text x="260" y="215" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#1e3a8a" text-anchor="middle">Terminal 1</text>
    <text x="260" y="245" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569" text-anchor="middle">All other airlines</text>
    <rect x="170" y="280" width="180" height="46" rx="8" fill="#1d4ed8"/>
    <text x="260" y="309" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">Metro Red Line</text>
  </g>

  <!-- T2 -->
  <g>
    <rect x="440" y="200" width="220" height="140" rx="14" fill="#fefce8" stroke="#a16207" stroke-width="2"/>
    <text x="550" y="245" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#854d0e" text-anchor="middle">Terminal 2</text>
    <text x="550" y="270" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#475569" text-anchor="middle">Charter &amp; scheduled</text>
    <text x="550" y="288" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#475569" text-anchor="middle">flights</text>
  </g>

  <!-- T3 -->
  <g>
    <rect x="720" y="150" width="360" height="240" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="900" y="200" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#9a3412" text-anchor="middle">Terminal 3</text>
    <text x="900" y="230" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569" text-anchor="middle">Emirates only — Concourses A, B &amp; C</text>
    <rect x="800" y="270" width="200" height="46" rx="8" fill="#ea580c"/>
    <text x="900" y="299" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">Metro · Taxi · Careem</text>
  </g>

  <text x="600" y="620" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Simplified schematic, not to scale — see the official interactive map for precise wayfinding.</text>
</svg>
