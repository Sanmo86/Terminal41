<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
  <rect width="1200" height="640" fill="#f8fafc"/>
  <text x="600" y="44" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#1e293b" text-anchor="middle">LHR — Simplified Terminal Layout</text>

  <rect x="60" y="560" width="1080" height="14" rx="7" fill="#cbd5e1"/>

  <!-- T2/T3 cluster -->
  <g>
    <rect x="90" y="160" width="230" height="180" rx="14" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
    <text x="205" y="205" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#1e3a8a" text-anchor="middle">Terminal 2</text>
    <text x="205" y="230" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#475569" text-anchor="middle">Star Alliance</text>
  </g>
  <g>
    <rect x="340" y="160" width="230" height="180" rx="14" fill="#f0fdf4" stroke="#166534" stroke-width="2"/>
    <text x="455" y="205" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#166534" text-anchor="middle">Terminal 3</text>
    <text x="455" y="230" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#475569" text-anchor="middle">Oneworld &amp; others</text>
  </g>

  <!-- T4 -->
  <g>
    <rect x="600" y="230" width="200" height="150" rx="14" fill="#fefce8" stroke="#a16207" stroke-width="2"/>
    <text x="700" y="270" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#854d0e" text-anchor="middle">Terminal 4</text>
    <text x="700" y="295" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#475569" text-anchor="middle">SkyTeam &amp; others</text>
  </g>

  <line x1="320" y1="250" x2="600" y2="300" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8 6"/>

  <!-- T5, separated, needs shuttle -->
  <g>
    <rect x="850" y="150" width="290" height="220" rx="14" fill="#fef2f2" stroke="#be123c" stroke-width="2"/>
    <text x="995" y="200" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#9f1239" text-anchor="middle">Terminal 5</text>
    <text x="995" y="230" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569" text-anchor="middle">British Airways only</text>
    <rect x="900" y="260" width="190" height="46" rx="8" fill="#9f1239"/>
    <text x="995" y="289" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">Elizabeth Line · Express</text>
  </g>

  <line x1="800" y1="280" x2="850" y2="260" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="820" y="245" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">shuttle train — not walkable</text>

  <text x="600" y="620" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Simplified schematic, not to scale — see the official interactive map for precise wayfinding.</text>
</svg>
