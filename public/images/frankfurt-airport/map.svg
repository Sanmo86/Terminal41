<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
  <rect width="1200" height="640" fill="#f8fafc"/>
  <text x="600" y="44" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#1e293b" text-anchor="middle">FRA — Simplified Terminal Layout</text>

  <rect x="60" y="560" width="1080" height="14" rx="7" fill="#cbd5e1"/>

  <!-- T1 -->
  <g>
    <rect x="150" y="150" width="340" height="220" rx="14" fill="#eff6ff" stroke="#1e293b" stroke-width="2"/>
    <text x="320" y="195" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#1e293b" text-anchor="middle">Terminal 1</text>
    <text x="320" y="222" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569" text-anchor="middle">Lufthansa &amp; Star Alliance</text>
    <rect x="200" y="255" width="240" height="46" rx="8" fill="#1e293b"/>
    <text x="320" y="284" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">Regional + Long-distance rail</text>
  </g>

  <line x1="490" y1="260" x2="620" y2="260" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="555" y="242" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">Skyline shuttle</text>

  <!-- T2 -->
  <g>
    <rect x="620" y="170" width="300" height="180" rx="14" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
    <text x="770" y="220" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#b91c1c" text-anchor="middle">Terminal 2</text>
    <text x="770" y="248" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569" text-anchor="middle">Other airlines</text>
  </g>

  <text x="600" y="620" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Simplified schematic, not to scale — see the official interactive map for precise wayfinding.</text>
</svg>
