<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
  <rect width="1200" height="640" fill="#f8fafc"/>
  <text x="600" y="44" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#1e293b" text-anchor="middle">CGK — Simplified Terminal Layout</text>

  <rect x="60" y="560" width="1080" height="14" rx="7" fill="#cbd5e1"/>

  <g>
    <rect x="120" y="190" width="260" height="170" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="250" y="270" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#9f1239" text-anchor="middle">Terminal 1</text>
    <text x="250" y="296" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#475569" text-anchor="middle">Domestic, Lion Air</text>
  </g>
  <g>
    <rect x="470" y="190" width="260" height="170" rx="14" fill="#f0fdf4" stroke="#166534" stroke-width="2"/>
    <text x="600" y="270" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#166534" text-anchor="middle">Terminal 2</text>
    <text x="600" y="296" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#475569" text-anchor="middle">Garuda Indonesia hub</text>
  </g>
  <g>
    <rect x="820" y="190" width="260" height="170" rx="14" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
    <text x="950" y="270" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#1e3a8a" text-anchor="middle">Terminal 3</text>
    <text x="950" y="296" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#475569" text-anchor="middle">International, newest</text>
  </g>

  <line x1="380" y1="275" x2="470" y2="275" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8 6"/>
  <line x1="730" y1="275" x2="820" y2="275" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8 6"/>

  <text x="600" y="450" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#64748b" text-anchor="middle">About 30–45 minutes by toll road or Damri bus to central Jakarta</text>
  <text x="600" y="620" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Simplified schematic, not to scale — see the official interactive map for precise wayfinding.</text>
</svg>
