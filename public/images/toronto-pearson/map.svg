<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
  <rect width="1200" height="640" fill="#f8fafc"/>
  <text x="600" y="44" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#1e293b" text-anchor="middle">YYZ — Simplified Terminal Layout</text>

  <rect x="60" y="560" width="1080" height="14" rx="7" fill="#cbd5e1"/>

  <!-- T1 -->
  <g>
    <rect x="220" y="150" width="340" height="240" rx="14" fill="#fef2f2" stroke="#7f1d1d" stroke-width="2"/>
    <text x="390" y="200" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#7f1d1d" text-anchor="middle">Terminal 1</text>
    <text x="390" y="230" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569" text-anchor="middle">Air Canada · Star Alliance</text>
    <rect x="270" y="270" width="240" height="46" rx="8" fill="#7f1d1d"/>
    <text x="390" y="299" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">UP Express station</text>
  </g>

  <line x1="560" y1="270" x2="640" y2="270" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="600" y="252" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">Link Train</text>

  <!-- T3 -->
  <g>
    <rect x="640" y="170" width="300" height="200" rx="14" fill="#eff6ff" stroke="#1e3a8a" stroke-width="2"/>
    <text x="790" y="220" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#1e3a8a" text-anchor="middle">Terminal 3</text>
    <text x="790" y="250" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569" text-anchor="middle">Other airlines</text>
  </g>

  <text x="600" y="620" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Simplified schematic, not to scale — see the official interactive map for precise wayfinding.</text>
</svg>
