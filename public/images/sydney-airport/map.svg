<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
  <rect width="1200" height="640" fill="#f8fafc"/>
  <text x="600" y="44" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#1e293b" text-anchor="middle">SYD — Simplified Terminal Layout</text>

  <rect x="60" y="560" width="1080" height="14" rx="7" fill="#cbd5e1"/>

  <!-- T1 -->
  <g>
    <rect x="140" y="150" width="300" height="220" rx="14" fill="#eff6ff" stroke="#0369a1" stroke-width="2"/>
    <text x="290" y="200" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#0c4a6e" text-anchor="middle">Terminal 1</text>
    <text x="290" y="230" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569" text-anchor="middle">International</text>
    <rect x="190" y="270" width="200" height="46" rx="8" fill="#0369a1"/>
    <text x="290" y="299" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">Airport Link Train</text>
  </g>

  <line x1="440" y1="260" x2="600" y2="260" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="520" y="242" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">train transfer</text>

  <!-- T2 -->
  <g>
    <rect x="600" y="170" width="230" height="180" rx="14" fill="#f0fdf4" stroke="#166534" stroke-width="2"/>
    <text x="715" y="220" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#166534" text-anchor="middle">Terminal 2</text>
    <text x="715" y="245" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#475569" text-anchor="middle">Virgin, Jetstar,</text>
    <text x="715" y="263" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#475569" text-anchor="middle">regionals (domestic)</text>
  </g>

  <!-- T3 -->
  <g>
    <rect x="860" y="170" width="230" height="180" rx="14" fill="#fefce8" stroke="#a16207" stroke-width="2"/>
    <text x="975" y="220" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#854d0e" text-anchor="middle">Terminal 3</text>
    <text x="975" y="245" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#475569" text-anchor="middle">Qantas domestic</text>
  </g>

  <text x="600" y="620" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Simplified schematic, not to scale — see the official interactive map for precise wayfinding.</text>
</svg>
