<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
  <rect width="1200" height="640" fill="#f8fafc"/>
  <text x="600" y="44" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#1e293b" text-anchor="middle">AMS — Simplified Terminal Layout</text>

  <!-- Central plaza -->
  <g>
    <rect x="480" y="260" width="240" height="140" rx="14" fill="#fff7ed" stroke="#7c2d12" stroke-width="2"/>
    <text x="600" y="310" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#7c2d12" text-anchor="middle">Schiphol Plaza</text>
    <text x="600" y="335" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569" text-anchor="middle">Train station · shops</text>
    <text x="600" y="355" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569" text-anchor="middle">Halls 1, 2, 3 entrances</text>
  </g>

  <!-- Piers fanning out -->
  <g stroke="#94a3b8" stroke-width="3" stroke-dasharray="8 6">
    <line x1="480" y1="290" x2="220" y2="150"/>
    <line x1="480" y1="330" x2="180" y2="330"/>
    <line x1="480" y1="370" x2="220" y2="500"/>
    <line x1="720" y1="290" x2="980" y2="150"/>
    <line x1="720" y1="330" x2="1020" y2="330"/>
    <line x1="720" y1="370" x2="980" y2="500"/>
  </g>

  <g fill="#0ea5e9">
    <rect x="120" y="110" width="140" height="70" rx="10"/>
    <rect x="60" y="295" width="140" height="70" rx="10"/>
    <rect x="120" y="460" width="140" height="70" rx="10"/>
    <rect x="940" y="110" width="140" height="70" rx="10"/>
    <rect x="1000" y="295" width="140" height="70" rx="10"/>
    <rect x="940" y="460" width="140" height="70" rx="10"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">
    <text x="190" y="152">Pier B</text>
    <text x="130" y="337">Pier C</text>
    <text x="190" y="502">Pier D</text>
    <text x="1010" y="152">Pier E</text>
    <text x="1070" y="337">Pier F/G</text>
    <text x="1010" y="502">Pier M</text>
  </g>

  <text x="600" y="620" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Simplified schematic, not to scale — see the official interactive map for precise wayfinding.</text>
</svg>
