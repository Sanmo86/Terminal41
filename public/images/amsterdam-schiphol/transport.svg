<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <rect width="1200" height="360" fill="none"/>
  <!-- Train card -->
  <g>
    <rect x="20" y="20" width="368" height="320" rx="16" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
    <circle cx="204" cy="90" r="34" fill="#0369a1"/>
    <text x="204" y="100" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#ffffff" text-anchor="middle">NS</text>
    <text x="204" y="160" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#1e293b" text-anchor="middle">NS Sprinter Train</text>
    <text x="204" y="200" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#0369a1" text-anchor="middle">from ~€6.20</text>
    <text x="204" y="232" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569" text-anchor="middle">~17 min to Amsterdam Centraal</text>
    <text x="204" y="260" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">8 trains/hour, station under terminal</text>
  </g>
  <!-- Bus card -->
  <g>
    <rect x="416" y="20" width="368" height="320" rx="16" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <circle cx="600" cy="90" r="34" fill="#ea580c"/>
    <text x="600" y="100" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#ffffff" text-anchor="middle">BUS</text>
    <text x="600" y="160" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#1e293b" text-anchor="middle">Regional Bus</text>
    <text x="600" y="200" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#ea580c" text-anchor="middle">varies by route</text>
    <text x="600" y="232" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569" text-anchor="middle">~30–45 min depending on stop</text>
    <text x="600" y="260" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">Useful for areas trains don't reach</text>
  </g>
  <!-- Taxi card -->
  <g>
    <rect x="812" y="20" width="368" height="320" rx="16" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
    <circle cx="996" cy="90" r="34" fill="#15803d"/>
    <text x="996" y="100" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#ffffff" text-anchor="middle">TAXI</text>
    <text x="996" y="160" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#1e293b" text-anchor="middle">Taxi</text>
    <text x="996" y="200" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#15803d" text-anchor="middle">€40 – €65</text>
    <text x="996" y="232" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569" text-anchor="middle">~20–30 min depending on traffic</text>
    <text x="996" y="260" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">Metered: ~€3.17/km + €0.52/min</text>
  </g>
</svg>
