<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
  <rect width="1200" height="640" fill="#f8fafc"/>
  <text x="600" y="44" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#1e293b" text-anchor="middle">CAN — Simplified Terminal Layout</text>

  <rect x="150" y="150" width="420" height="260" rx="18" fill="#ecfdf5" stroke="#065f46" stroke-width="2"/>
  <text x="360" y="200" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#065f46" text-anchor="middle">Terminal 1</text>
  <text x="360" y="228" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#065f46" text-anchor="middle">China Southern hub</text>

  <rect x="630" y="150" width="420" height="260" rx="18" fill="#eff6ff" stroke="#1e3a8a" stroke-width="2"/>
  <text x="840" y="200" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#1e3a8a" text-anchor="middle">Terminal 2</text>
  <text x="840" y="228" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1e3a8a" text-anchor="middle">SkyTeam &amp; international</text>

  <line x1="570" y1="280" x2="630" y2="280" stroke="#94a3b8" stroke-width="8"/>
  <text x="600" y="440" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#64748b" text-anchor="middle">Connected by the automated people mover (APM)</text>

  <text x="600" y="620" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Simplified schematic, not to scale — see the official interactive map for precise wayfinding.</text>
