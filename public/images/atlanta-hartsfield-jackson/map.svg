<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
  <rect width="1200" height="640" fill="#f8fafc"/>
  <text x="600" y="44" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#1e293b" text-anchor="middle">ATL — Simplified Concourse Layout</text>

  <line x1="70" y1="330" x2="1130" y2="330" stroke="#94a3b8" stroke-width="5" stroke-dasharray="10 6"/>
  <text x="600" y="380" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#64748b" text-anchor="middle">The Plane Train — underground, ~every 2 minutes</text>

  <g fill="#0c4a6e">
    <rect x="80" y="270" width="120" height="70" rx="10"/>
    <rect x="230" y="270" width="120" height="70" rx="10"/>
    <rect x="380" y="270" width="120" height="70" rx="10"/>
    <rect x="530" y="230" width="140" height="110" rx="10" fill="#166534"/>
    <rect x="700" y="270" width="120" height="70" rx="10"/>
    <rect x="850" y="270" width="120" height="70" rx="10"/>
    <rect x="1000" y="270" width="120" height="70" rx="10"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">
    <text x="140" y="312">A</text>
    <text x="290" y="312">B</text>
    <text x="440" y="312">C</text>
    <text x="600" y="290">Domestic</text>
    <text x="600" y="312">Terminal (T)</text>
    <text x="760" y="312">D</text>
    <text x="910" y="312">E</text>
    <text x="1060" y="312">F</text>
  </g>
  <text x="1060" y="360" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">International</text>

  <text x="600" y="620" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Simplified schematic, not to scale — see the official interactive map for precise wayfinding.</text>
</svg>
