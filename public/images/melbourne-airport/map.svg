<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
  <rect width="1200" height="640" fill="#f8fafc"/>
  <text x="600" y="44" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#1e293b" text-anchor="middle">MEL — Simplified Terminal Layout</text>

  <rect x="60" y="560" width="1080" height="14" rx="7" fill="#cbd5e1"/>

  <line x1="140" y1="260" x2="1080" y2="260" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="600" y="242" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">connected by internal walkway</text>

  <g fill="#0369a1">
    <rect x="140" y="290" width="200" height="90" rx="10"/>
    <rect x="380" y="290" width="200" height="90" rx="10" fill="#581c87"/>
    <rect x="620" y="290" width="200" height="90" rx="10"/>
    <rect x="860" y="290" width="200" height="90" rx="10" fill="#581c87"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">
    <text x="240" y="330">Terminal 1</text>
    <text x="240" y="350" font-size="13">Qantas (domestic)</text>
    <text x="480" y="330">Terminal 2</text>
    <text x="480" y="350" font-size="13">International</text>
    <text x="720" y="330">Terminal 3</text>
    <text x="720" y="350" font-size="13">Virgin (domestic)</text>
    <text x="960" y="330">Terminal 4</text>
    <text x="960" y="350" font-size="13">Budget domestic</text>
  </g>

  <text x="600" y="620" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Simplified schematic, not to scale — see the official interactive map for precise wayfinding.</text>
</svg>
