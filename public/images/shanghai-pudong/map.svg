<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
  <rect width="1200" height="640" fill="#f8fafc"/>
  <text x="600" y="44" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#1e293b" text-anchor="middle">PVG — Simplified Terminal Layout</text>

  <rect x="60" y="560" width="1080" height="14" rx="7" fill="#cbd5e1"/>

  <!-- T1 -->
  <g>
    <rect x="180" y="170" width="300" height="180" rx="14" fill="#fef2f2" stroke="#7f1d1d" stroke-width="2"/>
    <text x="330" y="220" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#7f1d1d" text-anchor="middle">Terminal 1</text>
    <text x="330" y="248" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569" text-anchor="middle">SkyTeam &amp; others</text>
  </g>

  <line x1="480" y1="260" x2="600" y2="260" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8 6"/>

  <!-- T2 -->
  <g>
    <rect x="600" y="170" width="300" height="180" rx="14" fill="#eff6ff" stroke="#1e3a8a" stroke-width="2"/>
    <text x="750" y="220" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#1e3a8a" text-anchor="middle">Terminal 2</text>
    <text x="750" y="248" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569" text-anchor="middle">China Eastern &amp; Star Alliance</text>
  </g>

  <line x1="700" y1="350" x2="700" y2="420" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8 6"/>
  <rect x="600" y="420" width="220" height="60" rx="10" fill="#a16207"/>
  <text x="710" y="456" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Maglev Station</text>

  <text x="600" y="620" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Simplified schematic, not to scale — see the official interactive map for precise wayfinding.</text>
</svg>
