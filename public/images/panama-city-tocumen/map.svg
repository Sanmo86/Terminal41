<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
  <rect width="1200" height="640" fill="#f8fafc"/>
  <text x="600" y="44" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#1e293b" text-anchor="middle">PTY — Simplified Terminal Layout</text>

  <rect x="220" y="220" width="320" height="140" rx="18" fill="#eff6ff" stroke="#1e3a8a" stroke-width="2"/>
  <text x="380" y="290" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#1e3a8a" text-anchor="middle">Terminal 1</text>
  <text x="380" y="314" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1e3a8a" text-anchor="middle">Copa Airlines hub</text>

  <rect x="660" y="220" width="320" height="140" rx="18" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
