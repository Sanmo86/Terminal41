<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
  <rect width="1200" height="640" fill="#f8fafc"/>
  <text x="600" y="44" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#1e293b" text-anchor="middle">PEK — Simplified Terminal Layout</text>

  <rect x="140" y="260" width="180" height="90" rx="10" fill="#78350f"/>
  <rect x="380" y="240" width="200" height="110" rx="10" fill="#78350f"/>
  <rect x="640" y="150" width="440" height="260" rx="18" fill="#fef2f2" stroke="#7f1d1d" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">
    <text x="230" y="312">Terminal 1</text>
    <text x="480" y="302">Terminal 2</text>
  </g>
  <text x="860" y="270" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#7f1d1d" text-anchor="middle">Terminal 3</text>
  <text x="860" y="296" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#7f1d1d" text-anchor="middle">Once the world's largest single terminal</text>

  <text x="600" y="470" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#64748b" text-anchor="middle">Air China's main hub</text>

  <text x="600" y="620" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Simplified schematic, not to scale — see the official interactive map for precise wayfinding.</text>
