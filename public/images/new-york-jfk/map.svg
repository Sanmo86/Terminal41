<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
  <rect width="1200" height="640" fill="#f8fafc"/>
  <text x="600" y="44" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#1e293b" text-anchor="middle">JFK — Simplified Terminal Layout</text>

  <ellipse cx="600" cy="340" rx="330" ry="230" fill="none" stroke="#94a3b8" stroke-width="4" stroke-dasharray="10 8"/>
  <text x="600" y="340" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">AirTrain loop</text>

  <g fill="#1d4ed8">
    <rect x="540" y="90" width="120" height="60" rx="10"/>
    <rect x="820" y="200" width="120" height="60" rx="10"/>
    <rect x="820" y="420" width="120" height="60" rx="10"/>
    <rect x="540" y="530" width="120" height="60" rx="10"/>
    <rect x="260" y="300" width="120" height="60" rx="10"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">
    <text x="600" y="125">Terminal 1</text>
    <text x="880" y="235">Terminal 4</text>
    <text x="880" y="455">Terminal 5</text>
    <text x="600" y="565">Terminal 7</text>
    <text x="320" y="335">Terminal 8</text>
  </g>
  <text x="600" y="605" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">New Terminal One (replacing former T2/T3) opening in phases through the late 2020s</text>

  <text x="600" y="628" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Simplified schematic, not to scale — see the official interactive map for precise wayfinding.</text>
</svg>
