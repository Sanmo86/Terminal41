<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <rect width="1200" height="360" fill="none"/>
  <!-- AirTrain + Subway -->
  <g>
    <rect x="20" y="20" width="368" height="320" rx="16" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
    <circle cx="204" cy="90" r="34" fill="#1e3a8a"/>
    <text x="204" y="100" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#ffffff" text-anchor="middle">A+MTA</text>
    <text x="204" y="160" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#1e293b" text-anchor="middle">AirTrain + Subway</text>
    <text x="204" y="200" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#1d4ed8" text-anchor="middle">$11.75 total</text>
    <text x="204" y="232" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569" text-anchor="middle">~60–80 min to Manhattan</text>
    <text x="204" y="260" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">Cheapest option, 24 hours</text>
  </g>
  <!-- AirTrain + LIRR -->
  <g>
    <rect x="416" y="20" width="368" height="320" rx="16" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <circle cx="600" cy="90" r="34" fill="#ea580c"/>
    <text x="600" y="100" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#ffffff" text-anchor="middle">A+LIRR</text>
    <text x="600" y="160" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#1e293b" text-anchor="middle">AirTrain + LIRR</text>
    <text x="600" y="200" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#ea580c" text-anchor="middle">$14 – $16 total</text>
    <text x="600" y="232" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569" text-anchor="middle">~35–45 min to Penn Station</text>
    <text x="600" y="260" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">Fastest public transit option</text>
  </g>
  <!-- Taxi -->
  <g>
    <rect x="812" y="20" width="368" height="320" rx="16" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
    <circle cx="996" cy="90" r="34" fill="#15803d"/>
    <text x="996" y="100" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#ffffff" text-anchor="middle">TAXI</text>
    <text x="996" y="160" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#1e293b" text-anchor="middle">Yellow Taxi (flat rate)</text>
    <text x="996" y="200" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#15803d" text-anchor="middle">$70 to Manhattan</text>
    <text x="996" y="232" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569" text-anchor="middle">~45–60 min depending on traffic</text>
    <text x="996" y="260" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">+tolls/tip, +$5 rush-hour fee</text>
  </g>
</svg>
