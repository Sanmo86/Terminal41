<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <rect width="1200" height="360" fill="none"/>
  <!-- Aerobús card -->
  <g>
    <rect x="20" y="20" width="368" height="320" rx="16" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
    <circle cx="204" cy="90" r="34" fill="#a16207"/>
    <text x="204" y="100" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#ffffff" text-anchor="middle">A1/A2</text>
    <text x="204" y="160" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#1e293b" text-anchor="middle">Aerobús</text>
    <text x="204" y="200" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#a16207" text-anchor="middle">€7.45 one-way</text>
    <text x="204" y="232" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569" text-anchor="middle">~35 min to Pl. Catalunya</text>
    <text x="204" y="260" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">24/7, every 5–20 min</text>
  </g>
  <!-- Train card -->
  <g>
    <rect x="416" y="20" width="368" height="320" rx="16" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
    <circle cx="600" cy="90" r="34" fill="#0f766e"/>
    <text x="600" y="100" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#ffffff" text-anchor="middle">R2N</text>
    <text x="600" y="160" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#1e293b" text-anchor="middle">Rodalies R2 Nord</text>
    <text x="600" y="200" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#0f766e" text-anchor="middle">€4.60 single</text>
    <text x="600" y="232" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569" text-anchor="middle">~20–25 min to Barcelona-Sants</text>
    <text x="600" y="260" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">T2 only — T1 needs shuttle first</text>
  </g>
  <!-- Taxi card -->
  <g>
    <rect x="812" y="20" width="368" height="320" rx="16" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
    <circle cx="996" cy="90" r="34" fill="#15803d"/>
    <text x="996" y="100" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#ffffff" text-anchor="middle">TAXI</text>
    <text x="996" y="160" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#1e293b" text-anchor="middle">Taxi</text>
    <text x="996" y="200" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#15803d" text-anchor="middle">€35 – €45</text>
    <text x="996" y="232" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569" text-anchor="middle">~25–40 min depending on traffic</text>
    <text x="996" y="260" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">Metered + €4.60 airport supplement</text>
  </g>
</svg>
