<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
  <rect width="1200" height="640" fill="#f8fafc"/>
  <text x="600" y="44" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#1e293b" text-anchor="middle">MIA — Simplified Terminal Layout</text>

  <rect x="140" y="240" width="220" height="90" rx="10" fill="#0f766e"/>
  <rect x="400" y="220" width="400" height="130" rx="10" fill="#9f1239"/>
  <rect x="840" y="240" width="220" height="90" rx="10" fill="#0f766e"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">
    <text x="250" y="290">North (D)</text>
    <text x="600" y="280">Central (E, F, G)</text>
    <text x="950" y="290">South (H, J)</text>
