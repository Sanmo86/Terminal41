<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <rect width="1200" height="360" fill="none"/>
  <!-- Keikyu -->
  <g>
    <rect x="20" y="20" width="368" height="320" rx="16" fill="#fef2f2" stroke="#be123c" stroke-width="2"/>
    <circle cx="204" cy="90" r="34" fill="#9f1239"/>
    <text x="204" y="100" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#ffffff" text-anchor="middle">KK</text>
    <text x="204" y="160" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#1e293b" text-anchor="middle">Keikyu Line</text>
    <text x="204" y="200" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#9f1239" text-anchor="middle">¥310 to Shinagawa</text>
    <text x="204" y="232" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569" text-anchor="middle">~13 minutes</text>
    <text x="204" y="260" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">Cheapest, connects to JR lines</text>
  </g>
  <!-- Monorail -->
  <g>
    <rect x="416" y="20" width="368" height="320" rx="16" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
    <circle cx="600" cy="90" r="34" fill="#5b21b6"/>
    <text x="600" y="100" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#ffffff" text-anchor="middle">MONO</text>
    <text x="600" y="160" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#1e293b" text-anchor="middle">Tokyo Monorail</text>
    <text x="600" y="200" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#5b21b6" text-anchor="middle">¥520 to Hamamatsuchō</text>
    <text x="600" y="232" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569" text-anchor="middle">~15–20 minutes</text>
    <text x="600" y="260" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">Connects to JR Yamanote Line</text>
  </g>
  <!-- Taxi -->
  <g>
    <rect x="812" y="20" width="368" height="320" rx="16" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
    <circle cx="996" cy="90" r="34" fill="#15803d"/>
    <text x="996" y="100" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#ffffff" text-anchor="middle">TAXI</text>
    <text x="996" y="160" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#1e293b" text-anchor="middle">Taxi</text>
    <text x="996" y="200" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#15803d" text-anchor="middle">¥5,000 – ¥11,000</text>
    <text x="996" y="232" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569" text-anchor="middle">~30–40 min depending on traffic</text>
    <text x="996" y="260" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">Varies by destination & time</text>
  </g>
</svg>
