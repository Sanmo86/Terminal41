<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
  <rect width="1200" height="640" fill="#f8fafc"/>
  <text x="600" y="44" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#1e293b" text-anchor="middle">HND — Simplified Terminal Layout</text>

  <rect x="60" y="560" width="1080" height="14" rx="7" fill="#cbd5e1"/>

  <!-- T1 -->
  <g>
    <rect x="90" y="140" width="260" height="200" rx="14" fill="#fef2f2" stroke="#be123c" stroke-width="2"/>
    <text x="220" y="180" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#9f1239" text-anchor="middle">Terminal 1</text>
    <text x="220" y="210" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569" text-anchor="middle">JAL &amp; domestic</text>
    <text x="220" y="230" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569" text-anchor="middle">group airlines</text>
  </g>

  <line x1="350" y1="240" x2="470" y2="240" stroke="#94a3b8" stroke-width="4" stroke-dasharray="8 6"/>

  <!-- T2 -->
  <g>
    <rect x="470" y="140" width="260" height="200" rx="14" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
    <text x="600" y="180" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#5b21b6" text-anchor="middle">Terminal 2</text>
    <text x="600" y="210" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569" text-anchor="middle">ANA &amp; Star Alliance</text>
    <text x="600" y="230" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569" text-anchor="middle">group airlines</text>
  </g>

  <line x1="730" y1="240" x2="850" y2="240" stroke="#94a3b8" stroke-width="4" stroke-dasharray="8 6"/>
  <text x="790" y="222" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">walkway / bus</text>

  <!-- T3 International -->
  <g>
    <rect x="850" y="140" width="260" height="200" rx="14" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
    <text x="980" y="180" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#1e3a8a" text-anchor="middle">Terminal 3</text>
    <text x="980" y="210" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569" text-anchor="middle">International</text>
    <text x="980" y="230" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569" text-anchor="middle">departures/arrivals</text>
  </g>

  <rect x="470" y="390" width="260" height="46" rx="8" fill="#166534"/>
  <text x="600" y="419" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">Keikyu Line · Tokyo Monorail · Taxi</text>

  <text x="600" y="620" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Simplified schematic, not to scale — see the official interactive map for precise wayfinding.</text>
</svg>
