<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
  <rect width="1200" height="640" fill="#f8fafc"/>
  <text x="600" y="44" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#1e293b" text-anchor="middle">CDG — Simplified Terminal Layout</text>

  <rect x="60" y="560" width="1080" height="14" rx="7" fill="#cbd5e1"/>

  <!-- T1 -->
  <g>
    <rect x="100" y="150" width="240" height="200" rx="120" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
    <text x="220" y="235" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#1e3a8a" text-anchor="middle">Terminal 1</text>
    <text x="220" y="260" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569" text-anchor="middle">Star Alliance</text>
  </g>

  <line x1="340" y1="250" x2="440" y2="250" stroke="#94a3b8" stroke-width="4" stroke-dasharray="8 6"/>
  <text x="390" y="232" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">CDGVAL</text>

  <!-- T2 cluster -->
  <g>
    <rect x="440" y="120" width="340" height="260" rx="14" fill="#fef2f2" stroke="#be123c" stroke-width="2"/>
    <text x="610" y="165" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#9f1239" text-anchor="middle">Terminal 2</text>
    <text x="610" y="190" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569" text-anchor="middle">Halls 2A–2G · Air France / SkyTeam</text>
    <rect x="480" y="220" width="260" height="46" rx="8" fill="#9f1239"/>
    <text x="610" y="249" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">RER B station · TGV station</text>
    <text x="610" y="300" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Largest cluster — check your hall (2A–2G)</text>
  </g>

  <line x1="780" y1="250" x2="880" y2="250" stroke="#94a3b8" stroke-width="4" stroke-dasharray="8 6"/>
  <text x="830" y="232" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">CDGVAL</text>

  <!-- T3 -->
  <g>
    <rect x="880" y="170" width="220" height="160" rx="14" fill="#fefce8" stroke="#a16207" stroke-width="2"/>
    <text x="990" y="240" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#854d0e" text-anchor="middle">Terminal 3</text>
    <text x="990" y="265" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569" text-anchor="middle">Low-cost carriers</text>
  </g>

  <text x="600" y="620" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Simplified schematic, not to scale — see the official interactive map for precise wayfinding.</text>
</svg>
