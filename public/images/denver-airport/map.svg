<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
  <rect width="1200" height="640" fill="#f8fafc"/>
  <text x="600" y="44" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#1e293b" text-anchor="middle">DEN — Simplified Terminal Layout</text>

  <rect x="440" y="140" width="320" height="120" rx="18" fill="#eff6ff" stroke="#1e3a8a" stroke-width="2"/>
  <text x="600" y="205" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1e3a8a" text-anchor="middle">Jeppesen Terminal</text>
  <text x="600" y="228" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1e3a8a" text-anchor="middle">Tent-shaped roof</text>

  <line x1="600" y1="260" x2="600" y2="330" stroke="#94a3b8" stroke-width="6"/>
  <text x="640" y="300" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b">underground train</text>

  <g fill="#b45309">
    <rect x="280" y="330" width="200" height="90" rx="10"/>
    <rect x="500" y="330" width="200" height="90" rx="10"/>
    <rect x="720" y="330" width="200" height="90" rx="10"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">
    <text x="380" y="382">Concourse A</text>
    <text x="600" y="382">Concourse B</text>
    <text x="820" y="382">Concourse C</text>
  </g>

  <text x="600" y="620" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Simplified schematic, not to scale — see the official interactive map for precise wayfinding.</text>
</svg>
