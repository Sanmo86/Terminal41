<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
  <rect width="1200" height="640" fill="#f8fafc"/>
  <text x="600" y="44" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#1e293b" text-anchor="middle">CAI — Simplified Terminal Layout</text>

  <rect x="60" y="560" width="1080" height="14" rx="7" fill="#cbd5e1"/>

  <!-- T1 -->
  <g>
    <rect x="110" y="180" width="260" height="180" rx="14" fill="#fff7ed" stroke="#92400e" stroke-width="2"/>
    <text x="240" y="230" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#7c2d12" text-anchor="middle">Terminal 1</text>
    <text x="240" y="255" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#475569" text-anchor="middle">Domestic &amp; regional</text>
  </g>

  <!-- T2 -->
  <g>
    <rect x="420" y="180" width="260" height="180" rx="14" fill="#fefce8" stroke="#a16207" stroke-width="2"/>
    <text x="550" y="230" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#854d0e" text-anchor="middle">Terminal 2</text>
    <text x="550" y="255" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#475569" text-anchor="middle">Regional &amp; international</text>
  </g>

  <!-- T3 -->
  <g>
    <rect x="730" y="150" width="320" height="240" rx="14" fill="#f0fdf4" stroke="#166534" stroke-width="2"/>
    <text x="890" y="200" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#166534" text-anchor="middle">Terminal 3</text>
    <text x="890" y="230" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#475569" text-anchor="middle">EgyptAir &amp; Star Alliance hub</text>
    <rect x="790" y="270" width="200" height="46" rx="8" fill="#166534"/>
    <text x="890" y="299" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle">BRT · Taxi · Uber</text>
  </g>

  <text x="600" y="620" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Simplified schematic, not to scale — see the official interactive map for precise wayfinding.</text>
</svg>
