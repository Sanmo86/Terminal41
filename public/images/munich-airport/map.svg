  <rect width="1200" height="640" fill="#f8fafc"/>
  <text x="600" y="44" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#1e293b" text-anchor="middle">MUC — Simplified Terminal Layout</text>

  <rect x="220" y="200" width="320" height="180" rx="18" fill="#eff6ff" stroke="#1e3a8a" stroke-width="2"/>
  <text x="380" y="270" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#1e3a8a" text-anchor="middle">Terminal 1</text>

  <rect x="660" y="200" width="320" height="180" rx="18" fill="#f0fdf4" stroke="#166534" stroke-width="2"/>
